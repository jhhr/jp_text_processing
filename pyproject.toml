# This directory is the `jp_text_processing` package itself, not a distribution root: the
# add-ons vendor it via `build.py` and import it as `<addon>.shared.jp_text_processing`.
# Nothing here is ever pip-installed, so this file only declares what the package is and
# gives the tooling a home.

[project]
name = "jp_text_processing"
version = "0.1.0"
description = "Japanese furigana, reading and word-highlighting processing shared by the Anki add-ons"
# The add-ons that ship this package load in every Anki since 2.1.50, and Anki's own builds ran
# Python 3.9 until 25.07: one module that 3.9 cannot import stops the whole add-on loading.
requires-python = ">=3.9"

# mypy 2 cannot check against 3.9 any more ("must be 3.10 or higher"), so this stays at the
# lowest version it accepts. What holds the 3.9 floor is ruff: its `target-version`, which
# also rejects newer syntax such as `match`, and its `FA` rules.
[tool.mypy]
python_version = "3.10"
explicit_package_bases = true

# `mecab_controller/` is a nested submodule vendored from an upstream fork; this repo does not
# edit it. Its import block is a deliberate reversed try/except so the package works both
# standalone and vendored, and mypy reports every arm of it as a redefinition of a module it
# cannot find — 32 of its 35 errors are that one scheme. Ignoring errors inside it (rather than
# `follow_imports = "skip"`) keeps mypy reading it, so our calls into it still get real types.
[[tool.mypy.overrides]]
module = "jp_text_processing.mecab_controller.*"
ignore_errors = true

# The suites live inside the package next to what they test and are named `*_tests.py`, not
# pytest's default `test_*.py`. Having this section here is also what makes this directory
# pytest's rootdir, so a run from `anki_shared/` reads these options and not the parent
# add-on repo's `pytest.ini`.
#
# `anki_shared/` has to be the working directory for `jp_text_processing` to be importable,
# and it holds an `anki/` package of its own that shadows the real one; pytest-anki's plugin
# is autoloaded and imports `aqt`, which then dies on `anki.lang`. Nothing here needs Anki.
#
# Case names are Japanese words as often as not, and pytest escapes non-ASCII in a test id to
# `\uXXXX` unless told otherwise, which leaves a case unrecognisable in the failure line and
# un-selectable with `-k`. The opt-out's name is a warning that ids then depend on the
# terminal's encoding; `PYTHONIOENCODING=utf-8` is already required here for anything that
# prints Japanese.
[tool.pytest.ini_options]
# conftest.py's timing hook is a new-style wrapper, which pytest before 8.0 rejects while loading
# the file and with it every suite, and its summary hook is annotated with
# `pytest.TerminalReporter`, which pytest only exports from 8.4. Either way the whole run fails
# on conftest.py; this turns that into a message saying what to upgrade.
minversion = "8.4"
python_files = ["*_tests.py"]
addopts = "-p no:anki"
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true

# Ruff is the linter here; this section is the rule set a check has to pass. `E`/`F` are the
# pycodestyle and pyflakes base, `UP` keeps the syntax at the 3.9 floor declared above, `I`
# the import order, `B` the bugbear traps and `SIM` the obvious simplifications. `FA` asks for
# `from __future__ import annotations` in a module whose annotations use `X | None`, which
# 3.9 cannot evaluate. It cannot see a union evaluated outside an annotation, such as an
# alias or an `isinstance` argument: spell those `Optional`/`Union`, or a tuple.
# `mecab_controller/` is vendored from upstream and not ours to reformat, same as for mypy.
[tool.ruff]
line-length = 100
target-version = "py39"
exclude = ["mecab_controller"]

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "B", "SIM", "FA"]
# E501 measures a line in display columns and counts a Japanese character as two of them, so
# two thirds of what it flags here are lines well under 100 characters that happen to be kana,
# and the rest are the reading strings the test cases are made of. The line length above still
# applies to `ruff format`, which is what actually wraps the code.
ignore = ["E501"]
